<style>
/* ── Black Hole Cursor ── */
*, *::before, *::after { box-sizing: border-box; }
body { cursor: none !important; }
*, a, button, input, select, textarea, [role="button"] { cursor: none !important; }

.custom-cursor {
  position: fixed;
  width: 30px; height: 30px;
  border-radius: 50%;
  background: radial-gradient(circle at center,
    rgba(0,0,0,1) 0%,
    rgba(20,0,40,0.85) 30%,
    rgba(40,0,80,0.6) 60%,
    rgba(80,0,160,0.35) 80%,
    transparent 100%);
  border: 2px solid rgba(255,0,255,0.65);
  pointer-events: none;
  z-index: 99999;
  transform: translate(-50%,-50%);
  animation: bhRotate 3s linear infinite;
  will-change: left, top;
}
.cursor-core {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 8px; height: 8px;
  background: #000; border-radius: 50%;
  box-shadow: 0 0 10px rgba(255,0,255,0.85);
}
.cursor-ring {
  position: absolute; top: 50%; left: 50%;
  transform: translate(-50%,-50%);
  width: 40px; height: 40px;
  border: 1px solid rgba(0,255,255,0.4);
  border-radius: 50%;
  animation: bhPulse 2s ease-in-out infinite;
}
@keyframes bhRotate {
  from { transform: translate(-50%,-50%) rotate(0deg); }
  to   { transform: translate(-50%,-50%) rotate(360deg); }
}
@keyframes bhPulse {
  0%,100% { transform: translate(-50%,-50%) scale(1); opacity:.8; }
  50%     { transform: translate(-50%,-50%) scale(1.2); opacity:.4; }
}
.custom-cursor.hover {
  border-color: rgba(0,255,255,0.9);
  filter: drop-shadow(0 0 8px rgba(0,255,255,0.6));
}
.custom-cursor.click {
  border-color: rgba(255,120,0,0.9);
  filter: drop-shadow(0 0 8px rgba(255,120,0,0.6));
}
.cursor-trail {
  position: fixed; width: 6px; height: 6px;
  background: radial-gradient(circle, rgba(255,0,255,0.8) 0%, transparent 70%);
  border-radius: 50%; pointer-events: none; z-index: 99998;
  animation: trailFade .9s ease-out forwards;
}
@keyframes trailFade {
  0%   { transform: translate(-50%,-50%) scale(1); opacity:.8; }
  100% { transform: translate(-50%,-50%) scale(0); opacity:0; }
}
.cursor-particle {
  position: fixed; width: 4px; height: 4px;
  background: rgba(255,0,255,0.6); border-radius: 50%;
  pointer-events: none; z-index: 99997;
  animation: particleFloat 1.8s ease-out forwards;
}
@keyframes particleFloat {
  0%   { transform: translate(-50%,-50%) scale(1); opacity:.8; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0); opacity:0; }
}

/* ── Original App CSS (verbatim from source, cleaned into style block) ── */
:root{
  --bg:#0b0c10;--surface:#13141a;--surface2:#1c1d26;--surface3:#23242f;
  --border:#2a2b38;--border2:#353647;--text:#e8e9f0;--muted:#6b6d7f;
  --cyan:#22d3ee;--purple:#a855f7;--danger:#f43f5e;--green:#22c55e;
  --grad:linear-gradient(90deg,#22d3ee,#a855f7);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* auth */
#authScreen{display:flex;align-items:center;justify-content:center;height:100vh;background:var(--bg)}
.authCard{background:var(--surface);border:1px solid var(--border2);border-radius:20px;padding:36px 32px;width:380px;max-width:calc(100vw - 32px);box-shadow:0 24px 64px rgba(0,0,0,.6)}
.authLogo{display:flex;align-items:center;gap:12px;margin-bottom:24px}
.authLogo svg{width:40px;height:40px}
.authLogo h1{font-size:1.5rem;font-weight:700;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.authTabs{display:flex;gap:4px;background:var(--surface2);border-radius:10px;padding:4px;margin-bottom:20px}
.authTab{flex:1;padding:8px;border:none;background:none;color:var(--muted);border-radius:7px;font-size:.9rem;transition:all .2s}
.authTab.active{background:var(--surface3);color:var(--text);font-weight:600}
.authForm{display:none;flex-direction:column;gap:10px}
.authForm.show{display:flex}
.authInput{background:var(--surface2);border:1px solid var(--border2);border-radius:10px;padding:12px 14px;color:var(--text);font-size:.95rem;outline:none;transition:border-color .2s}
.authInput:focus{border-color:var(--cyan)}
.authError{color:var(--danger);font-size:.82rem;display:none;min-height:16px}
.gradBtn{padding:13px;background:var(--grad);border:none;border-radius:10px;color:#fff;font-size:1rem;font-weight:600;margin-top:4px;transition:opacity .2s}
.gradBtn:hover{opacity:.88}
.gradBtn:disabled{opacity:.5}

/* app layout */
#app{display:none;height:100vh;flex-direction:row}
#sidebar{width:260px;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0}
#mainArea{flex:1;display:flex;overflow:hidden}

/* sidebar head */
.sidebarHead{display:flex;align-items:center;gap:10px;padding:14px 14px 10px;border-bottom:1px solid var(--border)}
.avatarCircle{width:36px;height:36px;border-radius:50%;background:var(--grad);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.9rem;flex-shrink:0}
.sidebarHeadInfo{flex:1;min-width:0}
.uname{font-size:.88rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.adminBadge{font-size:.68rem;background:var(--grad);color:#fff;padding:2px 8px;border-radius:20px;font-weight:700}
.msgLimitBadge{font-size:.7rem;color:var(--muted);margin-top:1px}
.logoutBtn{background:none;border:none;color:var(--muted);padding:6px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:color .15s}
.logoutBtn:hover{color:var(--danger)}

/* side tabs */
.sideTabs{display:flex;gap:2px;padding:8px 8px 4px;border-bottom:1px solid var(--border)}
.sideTab{flex:1;display:flex;align-items:center;justify-content:center;gap:4px;padding:7px 4px;background:none;border:none;color:var(--muted);border-radius:8px;font-size:.78rem;transition:all .2s}
.sideTab svg{width:14px;height:14px}
.sideTab.active{background:var(--surface2);color:var(--cyan);font-weight:600}
.sideTab:hover:not(.active){background:var(--surface2);color:var(--text)}

/* side panels */
.sidePanel{display:none;flex-direction:column;flex:1;overflow:hidden}
.sidePanel.show{display:flex}
.createArea{padding:10px;border-bottom:1px solid var(--border)}
.createRow{display:flex;gap:6px;margin-bottom:6px}
.sideInput{flex:1;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;padding:9px 10px;color:var(--text);font-size:.82rem;outline:none;min-width:0;transition:border-color .2s}
.sideInput:focus{border-color:var(--cyan)}
.sideSmBtn{padding:9px 14px;background:var(--grad);border:none;border-radius:8px;color:#fff;font-size:.82rem;font-weight:600;white-space:nowrap;transition:opacity .2s}
.sideSmBtn:hover{opacity:.85}
.chatListScroll{flex:1;overflow-y:auto;padding:6px}
.chatListScroll::-webkit-scrollbar{width:4px}
.chatListScroll::-webkit-scrollbar-track{background:transparent}
.chatListScroll::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}

/* chat items */
.chatItem{display:flex;align-items:center;gap:8px;padding:9px 10px;border-radius:10px;transition:background .15s;position:relative}
.chatItem:hover{background:var(--surface2)}
.chatItem.active{background:var(--surface3)}
.chatItemIcon{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.chatItemIcon svg{width:14px;height:14px;color:var(--muted)}
.chatItemLabel{flex:1;font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chatItemDel{background:none;border:none;color:var(--muted);font-size:.85rem;padding:2px 6px;border-radius:5px;display:none;transition:color .15s}
.chatItem:hover .chatItemDel{display:block}
.chatItemDel:hover{color:var(--danger)}

/* admin */
.adminSection{padding:10px;border-bottom:1px solid var(--border)}
.adminSection h4{font-size:.78rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.adminRow{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.adminLimitRow{display:flex;align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.adminLimitInput{width:70px;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:7px 8px;color:var(--text);font-size:.82rem;outline:none}

#mainArea{
  position:relative;overflow:hidden;
  background:url('https://c4.wallpaperflare.com/wallpaper/145/307/661/black-hole-on-earth-hd-wallpaper-wallpaper-preview.jpg') center/cover no-repeat;
}
#mainArea::before{display:none}
#bhCanvas{display:none}
#emptyState,#chatView{position:relative;z-index:1;flex:1}

/* chat view */
#chatView{display:none;flex-direction:column;flex:1}
.chatTopBar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--border);background:rgba(19,20,26,.72);backdrop-filter:blur(12px)}
.chatTopName{font-size:1rem;font-weight:600}
.chatTopActions{display:flex;gap:6px}
.iconBtn{display:flex;align-items:center;gap:6px;padding:7px 12px;background:rgba(28,29,38,.7);border:1px solid var(--border);border-radius:9px;color:var(--muted);font-size:.8rem;transition:all .2s;backdrop-filter:blur(8px)}
.iconBtn svg{width:14px;height:14px}
.iconBtn:hover{border-color:var(--cyan);color:var(--cyan)}
.messagesArea{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:4px;background:transparent}
.messagesArea::-webkit-scrollbar{width:5px}
.messagesArea::-webkit-scrollbar-track{background:transparent}
.messagesArea::-webkit-scrollbar-thumb{background:var(--border2);border-radius:3px}
.msgRow{display:flex;flex-direction:column;max-width:72%;margin-bottom:2px}
.msgRow:has(.msgBubble.own){align-self:flex-end;align-items:flex-end}
.msgMeta{font-size:.72rem;color:var(--muted);margin-bottom:3px;padding:0 4px}
.msgBubble{background:rgba(19,20,26,.75);border:1px solid var(--border2);border-radius:14px 14px 14px 4px;padding:10px 14px;font-size:.9rem;line-height:1.5;word-break:break-word;max-width:100%;backdrop-filter:blur(10px)}
.msgBubble.own{background:rgba(34,211,238,.08);border-color:rgba(168,85,247,.35);border-radius:14px 14px 4px 14px;backdrop-filter:blur(10px)}
.msgBubble img{max-width:100%;border-radius:8px;margin:6px 0;display:block}
.msgBubble a{color:var(--cyan);word-break:break-all}
.vmLabel,.fileLabel{font-size:.75rem;color:var(--muted);margin-bottom:6px}
.msgBubble audio{width:100%;margin-top:4px}
.limitBar{display:flex;align-items:center;gap:10px;padding:6px 16px;background:rgba(19,20,26,.8);border-top:1px solid var(--border);font-size:.78rem;color:var(--muted);backdrop-filter:blur(8px)}
.limitBarFill{flex:1;height:4px;background:var(--surface2);border-radius:2px;overflow:hidden}
.limitBarProgress{height:100%;background:var(--grad);border-radius:2px;transition:width .4s}
.limitBarProgress.warn{background:linear-gradient(90deg,#f59e0b,var(--danger))}
.inputBar{display:flex;gap:8px;padding:12px 16px;background:rgba(19,20,26,.8);border-top:1px solid var(--border);backdrop-filter:blur(12px)}
.chatInput{flex:1;background:rgba(28,29,38,.8);border:1px solid var(--border2);border-radius:12px;padding:11px 14px;color:var(--text);font-size:.92rem;outline:none;transition:border-color .2s}
.chatInput:focus{border-color:var(--cyan)}
.chatInput:disabled{opacity:.5}
.sendBtn{padding:10px 20px;background:var(--grad);border:none;border-radius:12px;color:#fff;font-size:.9rem;font-weight:600;transition:opacity .2s;flex-shrink:0}
.sendBtn:hover{opacity:.85}
.sendBtn:disabled{opacity:.45}
.emptyState{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:var(--muted);background:transparent}
.emptyState svg{width:48px;height:48px;opacity:.3}
.emptyState p{font-size:.95rem;opacity:.5}
#chatView.drag-over{outline:2px dashed var(--cyan);outline-offset:-4px}

/* notification button */
#notifBtn{position:fixed;bottom:14px;right:14px;padding:8px 14px;background:var(--surface2);border:1px solid var(--border2);border-radius:20px;color:var(--text);font-size:.8rem;z-index:200;transition:all .2s;display:none}
#notifBtn:hover{border-color:var(--cyan)}
#notifBtn.granted{border-color:var(--green);color:var(--green)}
#notifBtn.denied{border-color:var(--danger);color:var(--danger)}

/* toast */
#toastContainer{position:fixed;top:16px;right:16px;z-index:250;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--surface);border:1px solid var(--border2);border-radius:12px;padding:12px 16px;max-width:300px;box-shadow:0 8px 32px rgba(0,0,0,.5);font-size:.85rem;animation:toastIn .3s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.tTitle{font-weight:600;margin-bottom:4px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

/* voicemail pill */
#vmPill{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:var(--danger);color:#fff;padding:8px 18px;border-radius:20px;font-size:.83rem;font-weight:600;z-index:200;display:none;animation:vmPulse 1.2s ease-in-out infinite}
@keyframes vmPulse{0%,100%{opacity:1}50%{opacity:.7}}

/* code modal */
@keyframes codeModalIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}

/* call screen */
#callScreen{display:none;position:fixed;inset:0;z-index:100;background:var(--bg);flex-direction:column}
.callBar{padding:12px 18px;border-bottom:1px solid var(--border);background:var(--surface)}
.callBar button{background:none;border:none;color:var(--cyan);font-size:.9rem}
.callBar button:hover{text-decoration:underline}
.voiceChatBody{flex:1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
#vc-starCanvas{position:absolute;inset:0;width:100%;height:100%}
.voiceChatBox{position:relative;z-index:2;background:rgba(19,20,26,.85);border:1px solid var(--border2);border-radius:20px;padding:36px 32px;text-align:center;max-width:420px;width:90%;backdrop-filter:blur(12px)}
.voiceChatBox h2{font-size:1.2rem;margin-bottom:10px;background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#vc-status{font-size:.88rem;color:var(--muted);margin-bottom:22px;min-height:40px}
.vcBtns{display:flex;flex-direction:column;gap:10px}
.vcBtns button{padding:11px;border:none;border-radius:10px;font-size:.9rem;font-weight:600;transition:opacity .2s}
.vcBtns button:hover{opacity:.85}
.vcBtns button:disabled{opacity:.35}
#vc-start-btn{background:var(--grad);color:#fff}
#vc-mute-btn{background:var(--danger);color:#fff}
#vc-end-btn{background:var(--surface2);color:var(--muted);border:1px solid var(--border2)!important}

.groupSearchArea{padding:6px 10px 4px;border-bottom:1px solid var(--border)}
.groupSectionLabel{padding:6px 10px 2px;font-size:.7rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;flex-shrink:0}
.searchResultItem{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;transition:background .15s}
.searchResultItem:hover{background:var(--surface2)}
.searchResultIcon{width:28px;height:28px;border-radius:50%;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.searchResultIcon svg{width:14px;height:14px;color:var(--muted)}
.searchResultInfo{flex:1;min-width:0}
.searchResultName{font-size:.84rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchResultSub{font-size:.72rem;color:var(--muted)}
.joinBtn{padding:5px 10px;background:var(--grad);border:none;border-radius:7px;color:#fff;font-size:.75rem;font-weight:600;flex-shrink:0;transition:opacity .2s}
.joinBtn:hover{opacity:.8}
.joinBtn.joined{background:var(--surface3);color:var(--muted);border:1px solid var(--border2)}
.leaveBtn{padding:5px 10px;background:none;border:1px solid var(--border2);border-radius:7px;color:var(--muted);font-size:.75rem;flex-shrink:0;transition:all .15s}
.leaveBtn:hover{border-color:var(--danger);color:var(--danger)}
.searchEmpty{font-size:.8rem;color:var(--muted);text-align:center;padding:14px 0}

/* msg context menu */
#msgContextMenu{display:none;position:fixed;z-index:300;background:var(--surface);border:1px solid var(--border2);border-radius:10px;padding:6px;box-shadow:0 8px 32px rgba(0,0,0,.6);min-width:140px}
#msgCtxDelete{width:100%;padding:9px 14px;background:none;border:none;color:var(--danger);border-radius:7px;font-size:.88rem;text-align:left;display:flex;align-items:center;gap:8px;transition:background .12s}
</style>
</head>

/* ══════════════════════════════════════════
   BLACK HOLE CURSOR
══════════════════════════════════════════ */
(function(){
  const cursor = document.getElementById('customCursor');
  let mx=0,my=0,cx=0,cy=0,trail=0;

  document.addEventListener('mousemove',e=>{
    mx=e.clientX; my=e.clientY;
    cursor.style.opacity='1';
    if(++trail%3===0) makeTrail(mx,my);
  });
  document.addEventListener('mouseleave',()=>cursor.style.opacity='0');
  document.addEventListener('mouseenter',()=>cursor.style.opacity='1');

  function animate(){
    cx+=(mx-cx)*.15; cy+=(my-cy)*.15;
    cursor.style.left=cx+'px'; cursor.style.top=cy+'px';
    requestAnimationFrame(animate);
  }
  animate();

  function makeTrail(x,y){
    const t=document.createElement('div');
    t.className='cursor-trail';
    t.style.left=x+'px'; t.style.top=y+'px';
    document.body.appendChild(t);
    setTimeout(()=>t.remove(),950);
  }

  function makeParticles(x,y,n=5){
    for(let i=0;i<n;i++){
      const p=document.createElement('div');
      p.className='cursor-particle';
      p.style.left=x+'px'; p.style.top=y+'px';
      const a=(Math.PI*2*i/n)+Math.random()*.5;
      const v=20+Math.random()*30;
      p.style.setProperty('--dx',Math.cos(a)*v+'px');
      p.style.setProperty('--dy',Math.sin(a)*v+'px');
      document.body.appendChild(p);
      setTimeout(()=>p.remove(),1900);
    }
  }

  // hover / click effects on interactive elements
  function bindHover(el){
    el.addEventListener('mouseenter',()=>{cursor.classList.add('hover'); makeParticles(mx,my,4);});
    el.addEventListener('mouseleave',()=>cursor.classList.remove('hover'));
    el.addEventListener('mousedown', ()=>{cursor.classList.add('click'); makeParticles(mx,my,6);});
    el.addEventListener('mouseup',  ()=>cursor.classList.remove('click'));
  }

  // bind existing elements
  document.querySelectorAll('button,a,input,select,textarea,.chatItem,[onclick]')
    .forEach(bindHover);

  // watch for dynamically added elements
  new MutationObserver(muts=>{
    muts.forEach(m=>m.addedNodes.forEach(n=>{
      if(n.nodeType!==1) return;
      if(['BUTTON','A','INPUT','SELECT','TEXTAREA'].includes(n.tagName)||n.classList.contains('chatItem'))
        bindHover(n);
      n.querySelectorAll&&n.querySelectorAll('button,a,input,select,textarea,.chatItem')
        .forEach(bindHover);
    }));
  }).observe(document.body,{childList:true,subtree:true});
})();

const groupChatsRef=db.ref("groupChats");

/* ── membership helpers ── */
/* joined groups stored at allowedUsers/<loginKey>/joinedGroups/<chatId> = true */
function membershipRef(chatId){return db.ref("allowedUsers/"+currentUser.loginKey+"/joinedGroups/"+chatId)}
function isMember(chatId){return currentUser.joinedGroups&&currentUser.joinedGroups[chatId]===true}

async function joinGroup(chatId,code,name){
  return new Promise(resolve=>{
    /* MAIN is always free; admin bypasses */
    if(chatId==="main"||currentUser.isAdmin){
      _doJoin(chatId,name);resolve(true);return;
    }
    openCodeModal(code,name,async()=>{
      await _doJoin(chatId,name);resolve(true);
    });
  });
}
async function _doJoin(chatId,name){
  if(!currentUser.joinedGroups)currentUser.joinedGroups={};
  currentUser.joinedGroups[chatId]=true;
  await membershipRef(chatId).set(true);
  loadJoinedGroups();
  subscribeNotif(chatId,name);
}
async function leaveGroup(chatId){
  if(chatId==="main"){alert("You can't leave the main chat.");return;}
  if(!confirm("Leave this group?"))return;
  delete currentUser.joinedGroups[chatId];
  await membershipRef(chatId).remove();
  if(currentChatId===chatId){
    document.getElementById("chatView").style.display="none";
    document.getElementById("emptyState").style.display="flex";
    currentChatId=null;
  }
  loadJoinedGroups();
  if(notifSubs[chatId]){try{notifSubs[chatId].unsub()}catch(e){}delete notifSubs[chatId];}
}

function loadChatLists(){
  /* load DMs as before */
  groupChatsRef.on("value",e=>{
    const o=document.getElementById("dmList");
    o.innerHTML="";
    e.forEach(e=>{
      const n=e.val();
      if(n&&n.dm){
        const t=norm(currentUser.displayName);
        if(currentUser.isAdmin||t===norm(n.p1)||t===norm(n.p2)){
          o.appendChild(makeChatItem(e.key,n));
          subscribeNotif(e.key,getChatLabel(n));
        }
      }
    });
  });
  /* load joined groups from user record */
  db.ref("allowedUsers/"+currentUser.loginKey+"/joinedGroups").once("value",snap=>{
    currentUser.joinedGroups=snap.val()||{};
    /* always ensure MAIN is joined */
    if(!currentUser.joinedGroups["main"]){
      currentUser.joinedGroups["main"]=true;
      membershipRef("main").set(true);
    }
    loadJoinedGroups();
  });
  /* live updates to joined groups */
  db.ref("allowedUsers/"+currentUser.loginKey+"/joinedGroups").on("value",snap=>{
    currentUser.joinedGroups=snap.val()||{};
    loadJoinedGroups();
  });

function loadJoinedGroups(){
  const list=document.getElementById("groupList");
  list.innerHTML="";
  const ids=Object.keys(currentUser.joinedGroups||{});
  if(!ids.length){list.innerHTML='<div class="searchEmpty">No groups joined yet</div>';return;}
  /* fetch each group and render */
  let pending=ids.length;
  ids.forEach(id=>{
    groupChatsRef.child(id).once("value",snap=>{
      pending--;
      const n=snap.val();
      if(!n||n.dm){if(!pending)_sortGroupList(list);return;}
      const item=makeChatItem(id,n);
      /* add leave button (not for main, not for admin) */
      if(id!=="main"&&!currentUser.isAdmin){
        const lb=document.createElement("button");
        lb.className="leaveBtn";lb.textContent="Leave";
        lb.onclick=e=>{e.stopPropagation();leaveGroup(id)};
        item.appendChild(lb);
      }
      list.appendChild(item);
      subscribeNotif(id,getChatLabel(n));
      if(!pending)_sortGroupList(list);
    });
  });
}
function _sortGroupList(list){
  /* put MAIN first */
  const items=[...list.children];
  items.sort((a,b)=>{
    const an=a.querySelector(".chatItemLabel");
    const bn=b.querySelector(".chatItemLabel");
    if(an&&an.textContent==="MAIN CHAT")return -1;
    if(bn&&bn.textContent==="MAIN CHAT")return 1;
    return 0;
  });
  items.forEach(i=>list.appendChild(i));
}

        box.appendChild(row);
      });
      if(!found)box.innerHTML=`<div class="searchEmpty">No groups found</div>`;
    });

      life: 0.4 + Math.random() * 0.6,
      decay: 0.0015 + Math.random() * 0.003,
      hue: Math.random() < 0.5 ? 0 : 1   /* 0=warm orange, 1=cool blue */
    };
  }

  /* ── jet particles ── */
  const JET_COUNT = 160;
  const jetParts = [];
  function makeJetParticle() {
    const dir = Math.random() < 0.5 ? 1 : -1;
    /* jets shoot diagonally upper-left / lower-right like the reference */
    const spread = (Math.random() - 0.5) * 0.18;
    return {
      dir,
      t: Math.random(),          /* 0=origin, 1=tip */
      speed: 0.006 + Math.random() * 0.01,
      spread,
      life: Math.random(),
      decay: 0.006 + Math.random() * 0.008,
      w: 1 + Math.random() * 3
    };
  }

  function resize() {
    const parent = canvas.parentElement;
    W = canvas.width  = parent.offsetWidth  || window.innerWidth;
    H = canvas.height = parent.offsetHeight || window.innerHeight;
    cx = W * 0.5;
    cy = H * 0.5;
  }

  /* ── helpers ── */
  function rcore() { return Math.min(W, H) * 0.055; }

  /* ── DRAW: star field ── */
  function drawStars() {
    stars.forEach(s => {
      s.flicker += s.speed;
      const a = s.a * (0.5 + 0.5 * Math.sin(s.flicker));
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r, 0, TWO_PI);
      ctx.fillStyle = `rgba(200,210,255,${a})`;
      ctx.fill();
    });
  }

  /* ── DRAW: diagonal relativistic jets (like reference — bright blue-white beams) ── */
  function drawJets() {
    const R = rcore();
    /* jet axis: ~45° diagonal, upper-left to lower-right */
    const JET_ANGLE = -Math.PI * 0.28; /* tilt from vertical */
    const jlen = Math.max(W, H) * 0.72;
    const pulse = 0.75 + 0.25 * Math.sin(frame * 0.05);

    [-1, 1].forEach(dir => {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(JET_ANGLE);

      /* outer wide glow */
      const gw = ctx.createLinearGradient(0, 0, 0, dir * jlen);
      gw.addColorStop(0,    `rgba(30,120,255,${0.55 * pulse})`);
      gw.addColorStop(0.15, `rgba(80,160,255,${0.35 * pulse})`);
      gw.addColorStop(0.5,  `rgba(100,180,255,${0.15 * pulse})`);
      gw.addColorStop(1,    'rgba(20,60,180,0)');
      ctx.beginPath();
      ctx.moveTo(-R * 2.2, 0);
      ctx.lineTo(0, dir * jlen);
      ctx.lineTo(R * 2.2, 0);
      ctx.closePath();
      ctx.fillStyle = gw;
      ctx.fill();

      /* bright core beam */
      const gc = ctx.createLinearGradient(0, 0, 0, dir * jlen * 0.85);
      gc.addColorStop(0,    `rgba(200,230,255,${0.9 * pulse})`);
      gc.addColorStop(0.1,  `rgba(100,180,255,${0.7 * pulse})`);
      gc.addColorStop(0.45, `rgba(60,130,255,${0.3 * pulse})`);
      gc.addColorStop(1,    'rgba(20,60,200,0)');
      ctx.beginPath();
      ctx.moveTo(-R * 0.35, 0);
      ctx.lineTo(0, dir * jlen * 0.85);
      ctx.lineTo(R * 0.35, 0);
      ctx.closePath();
      ctx.fillStyle = gc;
      ctx.fill();

      /* jet particle streaks */
      ctx.restore();
    });

    /* jet particle update & draw */
    while (jetParts.length < JET_COUNT) jetParts.push(makeJetParticle());
    jetParts.forEach((p, i) => {
      p.life -= p.decay;
      if (p.life <= 0) { jetParts[i] = makeJetParticle(); return; }
      p.t += p.speed;
      if (p.t > 1) { jetParts[i] = makeJetParticle(); return; }

      const jlen2 = Math.max(W, H) * 0.68;
      const JA = -Math.PI * 0.28;
      const bx = Math.cos(JA + Math.PI/2) * p.dir * jlen2 * p.t;
      const by = Math.sin(JA + Math.PI/2) * p.dir * jlen2 * p.t;
      const off = p.spread * jlen2 * p.t;
      const ox = Math.cos(JA) * off;
      const oy = Math.sin(JA) * off;

      const alpha = p.life * (1 - p.t * 0.6) * pulse;
      ctx.beginPath();
      ctx.arc(cx + bx + ox, cy + by + oy, p.w, 0, TWO_PI);
      ctx.fillStyle = `rgba(160,210,255,${alpha})`;
      ctx.fill();
    });
  }

  /* ── DRAW: dust torus / accretion cloud (the dark flat disk in the reference) ── */
  function drawDustTorus() {
    const R = rcore();
    const diskW = Math.min(W, H) * 0.44;
    const diskH = diskW * 0.14; /* very flat */

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.08); /* slight tilt to match reference angle */

    /* layered dark dust cloud — multiple ellipses with varying opacity */
    for (let i = 5; i >= 0; i--) {
      const t = i / 5;
      const ew = diskW * (0.4 + t * 0.6);
      const eh = diskH * (0.5 + t * 0.9) + R * 0.5;
      const alpha = 0.55 - t * 0.35;
      /* dark brown/grey dust */
      ctx.beginPath();
      ctx.ellipse(0, 0, ew, eh, 0, 0, TWO_PI);
      ctx.fillStyle = `rgba(${15+t*20},${8+t*10},${3+t*5},${alpha})`;
      ctx.fill();
    }

    /* warm orange/brown core glow at the center of disk */
    const cg = ctx.createRadialGradient(0, 0, R * 0.5, 0, 0, diskW * 0.3);
    cg.addColorStop(0,   `rgba(255,140,40,0.5)`);
    cg.addColorStop(0.3, `rgba(220,80,20,0.2)`);
    cg.addColorStop(1,   'rgba(80,20,5,0)');
    ctx.beginPath();
    ctx.ellipse(0, 0, diskW * 0.3, diskH * 2.5, 0, 0, TWO_PI);
    ctx.fillStyle = cg;
    ctx.fill();

    ctx.restore();
  }

  /* ── DRAW: hot accretion disk (bright ring behind/around torus) ── */
  function drawAccretionDisk() {
    const R = rcore();
    const rot = frame * 0.004;

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(-0.08);
    ctx.scale(1, 0.13); /* very thin disk */

    /* disk rings: inner=hot white/orange, outer=cool blue */
    const rings = [
      { r: R * 1.35, r2: R * 2.2,  c0: 'rgba(255,220,120,0.9)', c1: 'rgba(255,140,40,0.0)' },
      { r: R * 2.0,  r2: R * 4.5,  c0: 'rgba(255,100,20,0.6)',  c1: 'rgba(180,60,10,0.0)' },
      { r: R * 4.0,  r2: R * 7.5,  c0: 'rgba(120,60,200,0.45)', c1: 'rgba(60,20,140,0.0)' },
      { r: R * 7.0,  r2: R * 12.0, c0: 'rgba(40,80,255,0.3)',   c1: 'rgba(10,30,160,0.0)' },
    ];

    rings.forEach(ring => {
      const g = ctx.createRadialGradient(0, 0, ring.r, 0, 0, ring.r2);
      g.addColorStop(0, ring.c0);
      g.addColorStop(1, ring.c1);
      ctx.beginPath();
      ctx.arc(0, 0, ring.r2, 0, TWO_PI);
      ctx.arc(0, 0, ring.r, 0, TWO_PI, true);
      ctx.fillStyle = g;
      ctx.fill('evenodd');
    });

    ctx.restore();

    /* rotating bright hotspot on disk */
    const hspot = rot * 2.1;
    const hR = R * 3.2;
    const hx = cx + Math.cos(hspot) * hR;
    const hy = cy + Math.sin(hspot) * hR * 0.13 - 0.08 * hR;
    const hg = ctx.createRadialGradient(hx, hy, 0, hx, hy, R * 1.5);
    hg.addColorStop(0,   'rgba(255,240,180,0.7)');
    hg.addColorStop(0.4, 'rgba(255,160,60,0.2)');
    hg.addColorStop(1,   'rgba(255,80,20,0)');
    ctx.beginPath();
    ctx.arc(hx, hy, R * 1.5, 0, TWO_PI);
    ctx.fillStyle = hg;
    ctx.fill();
  }

  /* ── DRAW: dust spiral particles ── */
  function drawDust() {
    const R = rcore();
    while (dust.length < DUST_COUNT) dust.push(makeDust(false));

    dust.forEach((d, i) => {
      d.ang += d.speed;
      d.dist -= d.dist * d.infall;
      d.life -= d.decay;

      if (d.life <= 0 || d.dist < R * 1.1) {
        dust[i] = makeDust(false);
        return;
      }

      /* project onto disk plane */
      const px = cx + Math.cos(d.ang - 0.08) * d.dist;
      const py = cy + Math.sin(d.ang - 0.08) * d.dist * 0.13;

      const closeness = Math.min(1, d.dist / (R * 8));
      const alpha = d.life * closeness * 0.7;

      ctx.beginPath();
      ctx.arc(px, py, d.size, 0, TWO_PI);
      if (d.hue === 0) {
        ctx.fillStyle = `rgba(255,${100 + Math.floor(closeness*80)},30,${alpha})`;
      } else {
        ctx.fillStyle = `rgba(80,${120+Math.floor(closeness*60)},255,${alpha * 0.6})`;
      }
      ctx.fill();
    });
  }

  /* ── DRAW: black hole shadow + photon ring ── */
  function drawBlackHole() {
    const R = rcore();

    /* gravitational lensing — warped blue glow around shadow */
    const lensg = ctx.createRadialGradient(cx, cy, R * 0.9, cx, cy, R * 4.5);
    lensg.addColorStop(0,    'rgba(0,0,0,0)');
    lensg.addColorStop(0.35, `rgba(10,40,120,${0.12 + 0.06*Math.sin(frame*0.04)})`);
    lensg.addColorStop(0.65, `rgba(5,20,80,0.06)`);
    lensg.addColorStop(1,    'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, R * 4.5, 0, TWO_PI);
    ctx.fillStyle = lensg;
    ctx.fill();

    /* photon sphere — bright thin ring */
    const pRing = R * 1.5;
    ctx.beginPath();
    ctx.arc(cx, cy, pRing, 0, TWO_PI);
    ctx.strokeStyle = `rgba(255,200,100,${0.6 + 0.2*Math.sin(frame*0.06)})`;
    ctx.lineWidth = R * 0.18;
    ctx.stroke();

    /* event horizon — pure black disk */
    ctx.beginPath();
    ctx.arc(cx, cy, R * 1.3, 0, TWO_PI);
    ctx.fillStyle = '#000';
    ctx.fill();

    /* faint inner glow just outside shadow */
    const ig = ctx.createRadialGradient(cx, cy, R * 1.3, cx, cy, R * 2.2);
    ig.addColorStop(0,   `rgba(255,160,50,${0.25 + 0.1*Math.sin(frame*0.07)})`);
    ig.addColorStop(0.5, `rgba(200,80,20,0.06)`);
    ig.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.arc(cx, cy, R * 2.2, 0, TWO_PI);
    ctx.fillStyle = ig;
    ctx.fill();
  }

  /* ── DRAW: space nebula background glow ── */
  function drawNebula() {
    /* deep blue nebula like the reference image */
    const ng = ctx.createRadialGradient(cx * 0.4, cy * 0.6, 0, cx, cy, Math.max(W,H) * 0.9);
    ng.addColorStop(0,   'rgba(5,15,60,0.8)');
    ng.addColorStop(0.3, 'rgba(3,10,45,0.6)');
    ng.addColorStop(0.7, 'rgba(2,5,25,0.5)');
    ng.addColorStop(1,   'rgba(0,2,12,1)');
    ctx.fillStyle = ng;
    ctx.fillRect(0, 0, W, H);

    /* secondary blue-purple cloud */
    const ng2 = ctx.createRadialGradient(cx * 1.6, cy * 1.4, 0, cx * 1.4, cy * 1.3, Math.max(W,H) * 0.55);
    ng2.addColorStop(0,   'rgba(10,5,50,0.5)');
    ng2.addColorStop(0.5, 'rgba(5,3,30,0.2)');
    ng2.addColorStop(1,   'rgba(0,0,0,0)');
    ctx.fillStyle = ng2;
    ctx.fillRect(0, 0, W, H);
  }

  function tick() {
    frame++;
    ctx.clearRect(0, 0, W, H);

    /* deep space */
    ctx.fillStyle = '#000408';
    ctx.fillRect(0, 0, W, H);

    drawNebula();
    drawStars();
    drawJets();
    drawAccretionDisk();
    drawDust();
    drawDustTorus();
    drawBlackHole();

    requestAnimationFrame(tick);
  }

  function boot() {
    resize();
    /* init dust with real W/H */
    for (let i = 0; i < DUST_COUNT; i++) dust.push(makeDust(true));
    for (let i = 0; i < JET_COUNT; i++) jetParts.push(makeJetParticle());
    window.addEventListener('resize', resize);
    tick();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    requestAnimationFrame(boot);
  }
})();

// misc
document.addEventListener("click",()=>getAudioCtx(),{once:!0});

  });
}

<script>
/* ══════════════════════════════════════════
   HIDDEN TRIGGER: Ctrl held + n-i-g-h-t, then Enter
   Nothing about this is referenced anywhere in the visible UI.
══════════════════════════════════════════ */
(function(){
  const SEQ=['n','i','g','h','t'];
  let idx=0,armed=false,resetTimer=null;
  function reset(){idx=0;armed=false}
  document.addEventListener('keydown',function(e){
    if(e.key==='Control')return;
    const k=e.key.toLowerCase();
    if(e.ctrlKey&&SEQ.includes(k))e.preventDefault(); // stop browser shortcuts (save/reload/etc) mid-sequence
    clearTimeout(resetTimer);
    resetTimer=setTimeout(reset,2500);
    if(armed){
      if(e.key==='Enter'){e.preventDefault();openIncogNight();reset()}
      else if(!(e.ctrlKey&&k===SEQ[0]))reset();
      return;
    }
    if(e.ctrlKey&&k===SEQ[idx]){
      idx++;
      if(idx===SEQ.length)armed=true;
    }else if(e.ctrlKey&&k===SEQ[0]){
      idx=1;
    }else{
      reset();
    }
  },true);
})();

let _incogRef=null,_incogListener=null;

function _incogSpawnStars(){
  const box=document.getElementById('incogStars');
  if(box.childElementCount)return;
  for(let i=0;i<70;i++){
    const s=document.createElement('div');
    s.className='incogStar';
    const sz=(Math.random()*1.6+0.6).toFixed(1);
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=(Math.random()*100)+'%';
    s.style.top=(Math.random()*60)+'%';
    s.style.animationDelay=(Math.random()*3).toFixed(2)+'s';
    box.appendChild(s);
  }
}

function openIncogNight(){
  if(!currentUser)return;
  document.getElementById('incogOverlay').classList.add('show');
  _incogSpawnStars();
  const box=document.getElementById('incogMessages');
  const inputBar=document.getElementById('incogInputBar');
  box.innerHTML='';
  if(_incogRef&&_incogListener){try{_incogRef.off('child_added',_incogListener)}catch(e){}_incogRef=null;_incogListener=null}
  if(!currentChatId){
    box.innerHTML='<div class="incogEmpty">Open a conversation on the main page first, then trigger incog-night-o again to whisper privately within it.</div>';
    inputBar.style.display='none';
    return;
  }
  inputBar.style.display='flex';
  _incogRef=db.ref('incogMessages/'+currentChatId);
  _incogListener=e=>{
    const m=e.val();if(!m)return;
    const own=currentUser&&norm(m.name)===norm(currentUser.displayName);
    const row=document.createElement('div');
    row.className='incogMsgRow'+(own?' own':'');
    row.innerHTML='<div class="incogMsgMeta">'+esc(m.name||'?')+'</div><div class="incogBubble">'+esc(m.text||'')+'</div>';
    box.appendChild(row);
    box.scrollTop=box.scrollHeight;
  };
  _incogRef.on('child_added',_incogListener);
}

function closeIncogNight(){
  document.getElementById('incogOverlay').classList.remove('show');
  if(_incogRef&&_incogListener){try{_incogRef.off('child_added',_incogListener)}catch(e){}}
  _incogRef=null;_incogListener=null;
}

function sendIncogMessage(){
  if(!currentUser||!currentChatId)return;
  const inp=document.getElementById('incogInput');
  const text=inp.value.trim();
  if(!text)return;
  inp.value='';
  db.ref('incogMessages/'+currentChatId).push({name:currentUser.displayName,text,ts:firebase.database.ServerValue.TIMESTAMP});
}
</script>
